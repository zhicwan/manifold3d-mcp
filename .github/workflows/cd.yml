name: Publish standalone runtimes

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify tag matches product version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { version } = require('./package.json');
            const expected = `v${version}`;
            const tag = context.ref.replace(/^refs\/tags\//, '');
            if (tag !== expected) {
              core.setFailed(`Tag ${tag} does not match product version (${expected})`);
            }

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            plugins/manifold/bin/manifold.mjs
            plugins/manifold-extension/extensions/manifold/extension.mjs
