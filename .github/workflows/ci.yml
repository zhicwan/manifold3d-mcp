name: CI
on:
  pull_request: {}
  push: { branches: [main] }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:viewer-flat
      - run: npm run build:plugins -- --check
      - run: git diff --exit-code
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:sync
      - run: npm run test:unit:built
      - run: npm run test:extension
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-e2e-failures
          path: |
            test-results/e2e/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run test:smoke:built
      - run: npm run verify --workspace @manifold3d/copilot-extension
